# Builds the PAi Health Android companion and checks its protocol core against the real PC code.
# Download the APK from the run's "Artifacts" section.
name: Android companion

on:
  push:
    paths: ["android/**", "engine/companion/**", "engine/tracker/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "engine/companion/**"]
  workflow_dispatch:

jobs:
  core-interop:
    name: Phone core vs PC (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -r engine/requirements.txt
      - name: Companion tests (PC side + Java core interop)
        working-directory: engine
        run: python -m unittest -v tests.test_companion tests.test_companion_java

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }

      - name: Debug APK (installs by sideloading)
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PAiHealth-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Optional: a release APK signed with your own key, so updates install over the old version.
      # Add repository secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Release APK (only when signing secrets exist)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          PAI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PAI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          PAI_KEYSTORE="$RUNNER_TEMP/release.jks" gradle assembleRelease --stacktrace --no-daemon
          rm -f "$RUNNER_TEMP/release.jks"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEY == 'true' }}
        with:
          name: PAiHealth-companion-release
          path: android/app/build/outputs/apk/release/app-release.apk
