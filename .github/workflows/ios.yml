# Builds the PAi Health iPhone companion on a GitHub macOS runner and holds its protocol core to the PC.
#   core:  swift test (known-answer vectors from the PC + Java core) and a live interop run against the PC server
#   app:   xcodegen + xcodebuild for the iOS Simulator (proves the app compiles; no signing needed)
#   ipa:   only when Apple signing secrets exist — a signed .ipa you can install on your registered iPhone
name: iPhone companion

on:
  push:
    paths: ["ios/**", "engine/companion/**", "engine/tracker/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "engine/companion/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Swift core tests + interop with PC
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Core unit tests (vectors)
        run: swift test --package-path ios/CompanionCore
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r engine/requirements.txt
      - name: Live interop (Swift core against the real PC server)
        working-directory: engine
        run: python -m unittest -v tests.test_companion_swift

  app:
    name: Build app (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project PAiHealthCompanion.xcodeproj -scheme PAiHealth \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -resultBundlePath SimulatorBuild.xcresult \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Package simulator app
        working-directory: ios
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/PAiHealth.app PAiHealth-simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-diagnostics
          path: |
            ios/build.log
            ios/SimulatorBuild.xcresult
      - uses: actions/upload-artifact@v4
        with:
          name: PAiHealth-iphone-simulator
          path: ios/PAiHealth-simulator.zip
          if-no-files-found: error

  ipa:
    name: Signed IPA (optional)
    runs-on: macos-15
    needs: [core, app]
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_B64 != '' && secrets.IOS_PROFILE_B64 != '' && secrets.IOS_TEAM_ID != '' }}
    steps:
      - name: Skip when no signing secrets
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: echo "No Apple signing secrets set; skipping the signed build. See ios/README.md."
      - uses: actions/checkout@v4
        if: ${{ env.HAS_SIGNING == 'true' }}
      - name: Install certificate and profile
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          P12: ${{ secrets.IOS_CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          if /usr/libexec/PlistBuddy -c "Print ProvisionedDevices" "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "EXPORT_METHOD=${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}" >> "$GITHUB_ENV"
          else
            echo "EXPORT_METHOD=app-store" >> "$GITHUB_ENV"
          fi
      - name: Archive and export
        if: ${{ env.HAS_SIGNING == 'true' }}
        working-directory: ios
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          brew install xcodegen && xcodegen generate
          xcodebuild -project PAiHealthCompanion.xcodeproj -scheme PAiHealth -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PAiHealth.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.pailuton.health.companion</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PAiHealth.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_SIGNING == 'true' }}
        with:
          name: PAiHealth-iphone-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
